name: Validar ramas y commits

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validar:
    name: Validar ramas y commits
    # Los bots (por ejemplo Dependabot) usan sus propios nombres.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar el nombre de la rama y los commits del PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER/commits" --paginate \
            --jq '.[].commit.message | split("\n")[0]' \
            | bash .github/scripts/validar-nombres.sh "$HEAD_REF"
