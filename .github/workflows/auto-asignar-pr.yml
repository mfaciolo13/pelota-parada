name: Asignar autor al PR

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  asignar:
    # Los bots (por ejemplo Dependabot) no se asignan a si mismos.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Asignar el PR a su autor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: gh pr edit "$PR_NUMBER" --add-assignee "$AUTHOR"
